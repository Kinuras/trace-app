<!DOCTYPE html>
<html>
<head>
    <title>AR Image Tracer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="controls">
        <label for="opacity">Opacity:</label>
        <input type="range" id="opacity" min="0" max="1" value="0.5" step="0.01">
        <button id="invert">Invert</button>
        <button id="grayscale">Grayscale</button>
        <button id="reset">Reset</button>
        <button id="lock">Lock</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const controls = document.getElementById('controls');
        const opacityInput = document.getElementById('opacity');
        const invertButton = document.getElementById('invert');
        const grayscaleButton = document.getElementById('grayscale');
        const resetButton = document.getElementById('reset');
        constLockButton = document.getElementById('lock');

        let img;
        let quad = [
            { x: 0, y: 0 },
            { x: 0, y: 0 },
            { x: 0, y: 0 },
            { x: 0, y: 0 }
        ];
        let opacity = 0.5;
        let isInverted = false;
        let isGrayscale = false;
        let isTracking = false;
        let scale = 1.0; // Added scale to handle resizing
        let offset_x = 0;
        let offset_y = 0;


        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Load the image
        const image = new Image();
        image.src = 'your_image.jpg'; // Replace with your image URL
        image.onload = () => {
            img = image;
            initCamera();
        };

        function initCamera() {
            // Initialize the camera here, you can add more sophisticated tracking methods here
            // This is a placeholder for more advanced camera tracking
            requestAnimationFrame(renderLoop);
        }

        function renderLoop() {
            requestAnimationFrame(renderLoop);

            // Clear the canvas
            canvas.clearRect(0, 0, canvas.width, canvas.height);

            // Draw the image
            drawImageQuad(img, quad, opacity, isInverted, isGrayscale, offset_x, offset_y, scale);

            // Update UI elements (this is simplified and could be done more efficiently)
            updateUI();
        }

        function updateUI() {
            opacityInput.value = opacity;

            if (isInverted) {
                invertButton.textContent = 'Uninvert';
            } else {
                invertButton.textContent = 'Invert';
            }

            if (isGrayscale) {
                grayscaleButton.textContent = 'UngrayScale';
            } else {
                grayscaleButton.textContent = 'Grayscale';
            }
        }

        // Event Handlers
        invertButton.addEventListener('click', () => {
            isInverted = !isInverted;
            updateUI();
        });

        grayscaleButton.addEventListener('click', () => {
            isGrayscale = !isGrayscale;
            updateUI();
        });

        opacityInput.addEventListener('input', (e) => {
            opacity = e.target.value;
            updateUI();
        });

        resetButton.addEventListener('click', () => {
            quad = [
                { x: 0, y: 0 },
                { x: 0, y: 0 },
                { x: 0, y: 0 },
                { x: 0, y: 0 }
            ];
            offset_x = 0;
            offset_y = 0;
            scale = 1.0;
            updateUI();
        });

        LockButton.addEventListener('click', () => {
            isTracking = !isTracking;
            updateUI();
        });


        // (You would add code here to detect surface plane)
        // For this example, we'll just add a simple manual adjustment system
        canvas.addEventListener('mousedown', (e) => {
            isTracking = false;
            offset_x = e.clientX - canvas.offsetLeft;
            offset_y = e.clientY - canvas.offsetTop;

            //  Add more robust interaction logic here, potentially using mousemove and mouseup
        });
    </script>
</body>
</html>
