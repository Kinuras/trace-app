<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TraceLock - AR Floor Tracing Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- A-Frame and AR.js Scripts -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            margin: 0;
            overflow: hidden;
            background-color: #020617;
            color-scheme: dark; /* Forces native browser camera permission dialogs into a readable dark-friendly theme */
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        input[type=range] {
            accent-color: #6366f1;
        }
        .a-enter-vr { display: none !important; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 overflow-hidden relative select-none">

    <!-- AR Scene Background & Floor Lock Target -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;" vr-mode-ui="enabled: false" class="absolute inset-0 z-0">
        <a-assets>
            <img id="ar-asset-image" src="" crossorigin="anonymous">
        </a-assets>

        <a-camera gps-camera rotation-reader>
            <a-ring color="#6366f1" radius-inner="0.015" radius-outer="0.025" position="0 0 -1"></a-ring>
        </a-camera>

        <!-- The virtual AR image anchored on the floor/world space -->
        <a-image 
            id="ar-target-image" 
            src="#ar-asset-image" 
            position="0 -1.2 -2.5" 
            rotation="-90 0 0" 
            width="1.2" 
            height="1.2" 
            visible="false">
        </a-image>
    </a-scene>

    <!-- UI Overlay Container -->
    <div id="workspace" class="absolute inset-0 overflow-hidden flex items-center justify-center pointer-events-none z-10">
        <!-- Placeholder when no image is uploaded -->
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-20 pointer-events-auto bg-slate-950/95 backdrop-blur-md">
            <div class="w-20 h-20 rounded-full bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center mb-4 text-indigo-400 text-2xl animate-pulse">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">Upload a Reference Image</h2>
            <p class="text-slate-400 text-sm max-w-xs mb-6">Select a sketch, line-art, or photo to lock onto your physical paper.</p>
            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition text-white px-6 py-3 rounded-xl font-semibold shadow-lg shadow-indigo-600/30 flex items-center gap-2">
                <i class="fa-solid fa-image"></i> Choose Image
                <input type="file" id="imageUpload" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Lock Active Indicator Badge -->
        <div id="lockBadge" class="absolute top-6 left-1/2 -translate-x-1/2 bg-rose-600/90 backdrop-blur-md text-white px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider shadow-2xl flex items-center gap-2.5 pointer-events-none hidden z-30 transition-all border border-rose-400/40 ring-4 ring-rose-500/20 animate-pulse">
            <i class="fa-solid fa-lock text-sm"></i> 🔒 Locked to Floor / Paper
        </div>
    </div>

    <!-- Control Panel Dock -->
    <div id="controlPanel" class="absolute bottom-6 left-4 right-4 max-w-md mx-auto glass-panel rounded-2xl p-4 shadow-2xl z-40 transition-all duration-300">
        
        <!-- Panel Header -->
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-indigo-500"></div>
                <h1 class="font-semibold text-sm tracking-wide text-slate-200">TraceLock AR Controls</h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="minimizeBtn" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition">
                    <i class="fa-solid fa-chevron-down transition-transform duration-300" id="minimizeIcon"></i>
                </button>
            </div>
        </div>

        <!-- Collapsible Content Wrapper -->
        <div id="panelContent" class="space-y-4">
            
            <!-- Opacity Slider -->
            <div class="space-y-1.5">
                <div class="flex justify-between text-xs text-slate-400 font-medium">
                    <span>Transparency / Opacity</span>
                    <span id="opacityVal">70%</span>
                </div>
                <input type="range" id="opacityRange" min="10" max="100" value="70" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- Size / Scale Slider -->
            <div class="space-y-1.5">
                <div class="flex justify-between text-xs text-slate-400 font-medium">
                    <span>Image Size (Fit to Paper)</span>
                    <span id="scaleVal">1.2m</span>
                </div>
                <input type="range" id="scaleRange" min="0.2" max="3.0" step="0.1" value="1.2" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- Action Buttons Grid -->
            <div class="grid grid-cols-3 gap-2 pt-1">
                <!-- Upload New -->
                <label title="Upload New" class="cursor-pointer bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 text-xs font-medium">
                    <i class="fa-solid fa-folder-open text-indigo-400 text-sm"></i>
                    <span>Upload</span>
                    <input type="file" id="imageUploadSecondary" accept="image/*" class="hidden">
                </label>

                <!-- Invert Colors -->
                <button id="invertBtn" title="Invert Image Colors" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 text-xs font-medium">
                    <i class="fa-solid fa-circle-half-stroke text-sky-400 text-sm"></i>
                    <span>Invert</span>
                </button>

                <!-- Grayscale -->
                <button id="grayscaleBtn" title="Toggle Grayscale" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 text-xs font-medium">
                    <i class="fa-solid fa-wand-magic-sparkles text-purple-400 text-sm"></i>
                    <span>B&W</span>
                </button>
            </div>

            <!-- Lock Image to Floor Button -->
            <button id="lockBtn" class="w-full py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-3 transition-all shadow-lg bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white shadow-indigo-600/30">
                <i class="fa-solid fa-location-crosshairs text-lg" id="lockIcon"></i>
                <span id="lockText">Lock Image on Floor</span>
            </button>
        </div>
    </div>

    <script>
        let state = {
            opacity: 0.7,
            scaleSize: 1.2,
            isLocked: false,
            isInverted: false,
            isGrayscale: false,
            minimized: false,
            imageUrl: ''
        };

        const emptyState = document.getElementById('emptyState');
        const lockBtn = document.getElementById('lockBtn');
        const lockIcon = document.getElementById('lockIcon');
        const lockText = document.getElementById('lockText');
        const lockBadge = document.getElementById('lockBadge');
        const opacityRange = document.getElementById('opacityRange');
        const opacityVal = document.getElementById('opacityVal');
        const scaleRange = document.getElementById('scaleRange');
        const scaleVal = document.getElementById('scaleVal');
        const invertBtn = document.getElementById('invertBtn');
        const grayscaleBtn = document.getElementById('grayscaleBtn');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const minimizeIcon = document.getElementById('minimizeIcon');
        const panelContent = document.getElementById('panelContent');
        
        const arAssetImage = document.getElementById('ar-asset-image');
        const arTargetImage = document.getElementById('ar-target-image');

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                state.imageUrl = event.target.result;
                arAssetImage.src = state.imageUrl;
                emptyState.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('imageUpload').addEventListener('change', handleImageUpload);
        document.getElementById('imageUploadSecondary').addEventListener('change', handleImageUpload);

        opacityRange.addEventListener('input', (e) => {
            state.opacity = e.target.value / 100;
            arTargetImage.setAttribute('material', `opacity: ${state.opacity}`);
            opacityVal.textContent = e.target.value + '%';
        });

        scaleRange.addEventListener('input', (e) => {
            state.scaleSize = parseFloat(e.target.value);
            // Maintain square aspect or proportional sizing in A-Frame width/height
            arTargetImage.setAttribute('width', state.scaleSize);
            arTargetImage.setAttribute('height', state.scaleSize);
            scaleVal.textContent = state.scaleSize.toFixed(1) + 'm';
        });

        lockBtn.addEventListener('click', () => {
            if (!state.imageUrl) {
                alert("Please upload an image first!");
                return;
            }

            const cameraEl = document.querySelector('a-camera');
            if (!cameraEl || !cameraEl.object3D) return;

            const position = cameraEl.object3D.position;
            const direction = new THREE.Vector3();
            cameraEl.object3D.getWorldDirection(direction);

            const distance = 1.8; // Place slightly closer for comfortable tracing
            const targetX = position.x - (direction.x * distance);
            const targetZ = position.z - (direction.z * distance);
            const floorY = position.y - 1.0; 

            arTargetImage.setAttribute('position', `${targetX} ${floorY} ${targetZ}`);
            arTargetImage.setAttribute('visible', 'true');

            state.isLocked = true;
            lockBadge.classList.remove('hidden');
            lockBtn.className = "w-full py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-3 transition-all shadow-xl bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white shadow-rose-600/40 ring-4 ring-rose-500/20 animate-pulse";
            lockIcon.className = "fa-solid fa-lock text-lg";
            lockText.textContent = "Relock / Update Position";
        });

        invertBtn.addEventListener('click', () => {
            state.isInverted = !state.isInverted;
            updateFilters();
            invertBtn.classList.toggle('bg-indigo-600', state.isInverted);
            invertBtn.classList.toggle('text-white', state.isInverted);
        });

        grayscaleBtn.addEventListener('click', () => {
            state.isGrayscale = !state.isGrayscale;
            updateFilters();
            grayscaleBtn.classList.toggle('bg-indigo-600', state.isGrayscale);
            grayscaleBtn.classList.toggle('text-white', state.isGrayscale);
        });

        function updateFilters() {
            let filters = [];
            if (state.isInverted) filters.push('invert(100%)');
            if (state.isGrayscale) filters.push('grayscale(100%)');
            arAssetImage.style.filter = filters.length > 0 ? filters.join(' ') : 'none';
        }

        minimizeBtn.addEventListener('click', () => {
            state.minimized = !state.minimized;
            if (state.minimized) {
                panelContent.classList.add('hidden');
                minimizeIcon.style.transform = 'rotate(180deg)';
            } else {
                panelContent.classList.remove('hidden');
                minimizeIcon.style.transform = 'rotate(0deg)';
            }
        });
    </script>
</body>
</html>
