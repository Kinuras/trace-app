<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TraceLock - Paper Tracing Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        input[type=range] {
            accent-color: #6366f1;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 overflow-hidden relative select-none">

    <div id="workspace" class="absolute inset-0 overflow-hidden flex items-center justify-center bg-slate-950">
        
        <!-- Camera Stream Background -->
        <video id="cameraStream" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover hidden"></video>

        <!-- Placeholder when no image is uploaded -->
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-10">
            <div class="w-20 h-20 rounded-full bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center mb-4 text-indigo-400 text-2xl animate-pulse">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">Upload a Reference Image</h2>
            <p class="text-slate-400 text-sm max-w-xs mb-6">Select a sketch, photo, or line art to trace over physical paper with your phone.</p>
            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition text-white px-6 py-3 rounded-xl font-semibold shadow-lg shadow-indigo-600/30 flex items-center gap-2">
                <i class="fa-solid fa-image"></i> Choose Image
                <input type="file" id="imageUpload" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Transformable & Movable Image Container -->
        <div id="imageContainer" class="absolute cursor-grab active:cursor-grabbing touch-none hidden z-20 transition-shadow" style="transform: translate(0px, 0px) scale(1) rotate(0deg); transform-origin: center center;">
            <img id="targetImage" src="" alt="Trace Reference" class="max-w-none pointer-events-none drop-shadow-2xl transition-opacity duration-150" style="width: 300px; opacity: 0.7;">
        </div>

        <!-- Lock Active Indicator Badge -->
        <div id="lockBadge" class="absolute top-6 left-1/2 -translate-x-1/2 bg-rose-600/90 backdrop-blur-md text-white px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider shadow-2xl flex items-center gap-2.5 pointer-events-none hidden z-30 transition-all border border-rose-400/40 ring-4 ring-rose-500/20 animate-pulse">
            <i class="fa-solid fa-lock text-sm"></i> 🔒 Locked to Paper (Touch Disabled)
        </div>

        <!-- Camera Active Indicator Badge -->
        <div id="camBadge" class="absolute top-6 left-6 bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1.5 pointer-events-none hidden z-30">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Camera On
        </div>
    </div>

    <div id="controlPanel" class="absolute bottom-6 left-4 right-4 max-w-md mx-auto glass-panel rounded-2xl p-4 shadow-2xl z-40 transition-all duration-300">
        
        <!-- Panel Header / Minimize Button -->
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-indigo-500"></div>
                <h1 class="font-semibold text-sm tracking-wide text-slate-200">TraceLock Controls</h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="toggleCamBtn" title="Toggle Camera Background" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition text-xs">
                    <i class="fa-solid fa-camera"></i>
                </button>
                <button id="minimizeBtn" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition">
                    <i class="fa-solid fa-chevron-down transition-transform duration-300" id="minimizeIcon"></i>
                </button>
            </div>
        </div>

        <!-- Collapsible Content Wrapper -->
        <div id="panelContent" class="space-y-4">
            
            <!-- Opacity Slider -->
            <div class="space-y-1.5">
                <div class="flex justify-between text-xs text-slate-400 font-medium">
                    <span>Transparency / Opacity</span>
                    <span id="opacityVal">70%</span>
                </div>
                <input type="range" id="opacityRange" min="10" max="100" value="70" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- Action Buttons Grid -->
            <div class="grid grid-cols-4 gap-2 pt-1">
                <!-- Upload New -->
                <label title="Upload New" class="cursor-pointer bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 text-xs font-medium">
                    <i class="fa-solid fa-folder-open text-indigo-400 text-sm"></i>
                    <span>Upload</span>
                    <input type="file" id="imageUploadSecondary" accept="image/*" class="hidden">
                </label>

                <!-- Reset View -->
                <button id="resetBtn" title="Reset Position & Zoom" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 text-xs font-medium">
                    <i class="fa-solid fa-rotate-left text-amber-400 text-sm"></i>
                    <span>Reset</span>
                    <span class="text-[9px] text-slate-400">View</span>
                </button>

                <!-- Invert Colors -->
                <button id="invertBtn" title="Invert Image Colors" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 text-xs font-medium">
                    <i class="fa-solid fa-circle-half-stroke text-sky-400 text-sm"></i>
                    <span>Invert</span>
                </button>

                <!-- Grayscale -->
                <button id="grayscaleBtn" title="Toggle Grayscale" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 py-2.5 rounded-xl flex flex-col items-center justify-center gap-1 text-xs font-medium">
                    <i class="fa-solid fa-wand-magic-sparkles text-purple-400 text-sm"></i>
                    <span>B&W</span>
                </button>
            </div>

            <button id="lockBtn" class="w-full py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-3 transition-all shadow-lg bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white shadow-indigo-600/30">
                <i class="fa-solid fa-lock-open text-lg" id="lockIcon"></i>
                <span id="lockText">Lock to Paper</span>
            </button>
        </div>
    </div>

    <script>
        let state = {
            x: 0,
            y: 0,
            scale: 1,
            rotation: 0,
            opacity: 0.7,
            isLocked: false,
            isInverted: false,
            isGrayscale: false,
            cameraActive: false,
            minimized: false
        };

        let isDragging = false;
        let startX = 0, startY = 0;
        let initialDistance = 0;
        let initialScale = 1;
        let initialAngle = 0;
        let initialRotation = 0;

        const workspace = document.getElementById('workspace');
        const imageContainer = document.getElementById('imageContainer');
        const targetImage = document.getElementById('targetImage');
        const emptyState = document.getElementById('emptyState');
        const lockBtn = document.getElementById('lockBtn');
        const lockIcon = document.getElementById('lockIcon');
        const lockText = document.getElementById('lockText');
        const lockBadge = document.getElementById('lockBadge');
        const opacityRange = document.getElementById('opacityRange');
        const opacityVal = document.getElementById('opacityVal');
        const resetBtn = document.getElementById('resetBtn');
        const invertBtn = document.getElementById('invertBtn');
        const grayscaleBtn = document.getElementById('grayscaleBtn');
        const toggleCamBtn = document.getElementById('toggleCamBtn');
        const cameraStream = document.getElementById('cameraStream');
        const camBadge = document.getElementById('camBadge');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const minimizeIcon = document.getElementById('minimizeIcon');
        const panelContent = document.getElementById('panelContent');
        const controlPanel = document.getElementById('controlPanel');

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                targetImage.src = event.target.result;
                targetImage.onload = () => {
                    emptyState.classList.add('hidden');
                    imageContainer.classList.remove('hidden');
                    
                    const naturalWidth = targetImage.naturalWidth || 300;
                    const screenWidth = window.innerWidth;
                    const initialWidth = Math.min(screenWidth * 0.75, naturalWidth);
                    targetImage.style.width = initialWidth + 'px';

                    state.x = 0;
                    state.y = 0;
                    state.scale = 1;
                    state.rotation = 0;
                    updateTransform();
                };
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('imageUpload').addEventListener('change', handleImageUpload);
        document.getElementById('imageUploadSecondary').addEventListener('change', handleImageUpload);

        function updateTransform() {
            imageContainer.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale}) rotate(${state.rotation}deg)`;
        }

        resetBtn.addEventListener('click', () => {
            if (state.isLocked) return;
            state.x = 0;
            state.y = 0;
            state.scale = 1;
            state.rotation = 0;
            updateTransform();
        });

        opacityRange.addEventListener('input', (e) => {
            state.opacity = e.target.value / 100;
            updateImageStyle();
            opacityVal.textContent = e.target.value + '%';
        });

        // Combined style updater so filters, opacity, and locked state never override each other
        function updateImageStyle() {
            let filters = [];
            if (state.isInverted) filters.push('invert(100%)');
            if (state.isGrayscale) filters.push('grayscale(100%)');
            
            targetImage.style.filter = filters.length > 0 ? filters.join(' ') : 'none';
            targetImage.style.opacity = state.opacity;
        }

        lockBtn.addEventListener('click', () => {
            state.isLocked = !state.isLocked;
            if (state.isLocked) {
                lockBtn.className = "w-full py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-3 transition-all shadow-xl bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white shadow-rose-600/40 ring-4 ring-rose-500/30 animate-pulse";
                lockIcon.className = "fa-solid fa-lock text-lg";
                lockText.textContent = "Unlock Position";
                lockBadge.classList.remove('hidden');
                
                imageContainer.style.pointerEvents = 'none';
                imageContainer.classList.add('ring-2', 'ring-rose-500/50', 'rounded-lg');
            } else {
                lockBtn.className = "w-full py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-3 transition-all shadow-lg bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white shadow-indigo-600/30";
                lockIcon.className = "fa-solid fa-lock-open text-lg";
                lockText.textContent = "Lock to Paper";
                lockBadge.classList.add('hidden');
                
                imageContainer.style.pointerEvents = 'auto';
                imageContainer.classList.remove('ring-2', 'ring-rose-500/50', 'rounded-lg');
            }
        });

        invertBtn.addEventListener('click', () => {
            state.isInverted = !state.isInverted;
            updateImageStyle();
            invertBtn.classList.toggle('bg-indigo-600', state.isInverted);
            invertBtn.classList.toggle('text-white', state.isInverted);
        });

        grayscaleBtn.addEventListener('click', () => {
            state.isGrayscale = !state.isGrayscale;
            updateImageStyle();
            grayscaleBtn.classList.toggle('bg-indigo-600', state.isGrayscale);
            grayscaleBtn.classList.toggle('text-white', state.isGrayscale);
        });

        toggleCamBtn.addEventListener('click', async () => {
            if (!state.cameraActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' },
                        audio: false
                    });
                    cameraStream.srcObject = stream;
                    cameraStream.classList.remove('hidden');
                    workspace.classList.remove('bg-slate-950');
                    workspace.classList.add('bg-black');
                    camBadge.classList.remove('hidden');
                    toggleCamBtn.classList.add('bg-indigo-600', 'text-white');
                    toggleCamBtn.classList.remove('bg-slate-800', 'text-slate-300');
                    state.cameraActive = true;
                } catch (err) {
                    console.error(err);
                }
            } else {
                const stream = cameraStream.srcObject;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                cameraStream.srcObject = null;
                cameraStream.classList.add('hidden');
                workspace.classList.add('bg-slate-950');
                workspace.classList.remove('bg-black');
                camBadge.classList.add('hidden');
                toggleCamBtn.classList.remove('bg-indigo-600', 'text-white');
                toggleCamBtn.classList.add('bg-slate-800', 'text-slate-300');
                state.cameraActive = false;
            }
        });

        minimizeBtn.addEventListener('click', () => {
            state.minimized = !state.minimized;
            if (state.minimized) {
                panelContent.classList.add('hidden');
                minimizeIcon.style.transform = 'rotate(180deg)';
            } else {
                panelContent.classList.remove('hidden');
                minimizeIcon.style.transform = 'rotate(0deg)';
            }
        });

        function getDistance(touches) {
            return Math.hypot(
                touches[0].clientX - touches[1].clientX,
                touches[0].clientY - touches[1].clientY
            );
        }

        function getAngle(touches) {
            return Math.atan2(
                touches[1].clientY - touches[0].clientY,
                touches[1].clientX - touches[0].clientX
            ) * (180 / Math.PI);
        }

        workspace.addEventListener('pointerdown', (e) => {
            if (state.isLocked) return;
            if (e.target === workspace || e.target === targetImage || e.target.closest('#imageContainer')) {
                isDragging = true;
                startX = e.clientX - state.x;
                startY = e.clientY - state.y;
                try { workspace.setPointerCapture(e.pointerId); } catch(err){}
            }
        });

        workspace.addEventListener('pointermove', (e) => {
            if (!isDragging || state.isLocked) return;
            state.x = e.clientX - startX;
            state.y = e.clientY - startY;
            updateTransform();
        });

        workspace.addEventListener('pointerup', (e) => {
            isDragging = false;
            try { workspace.releasePointerCapture(e.pointerId); } catch(err){}
        });

        workspace.addEventListener('pointercancel', (e) => {
            isDragging = false;
        });

        workspace.addEventListener('touchstart', (e) => {
            if (state.isLocked) return;
            if (e.touches.length === 2) {
                isDragging = false;
                initialDistance = getDistance(e.touches);
                initialScale = state.scale;
                initialAngle = getAngle(e.touches);
                initialRotation = state.rotation;
            }
        }, { passive: true });

        workspace.addEventListener('touchmove', (e) => {
            if (state.isLocked) return;
            if (e.touches.length === 2) {
                e.preventDefault();
                const currentDistance = getDistance(e.touches);
                if (initialDistance > 0) {
                    let newScale = initialScale * (currentDistance / initialDistance);
                    state.scale = Math.max(0.2, Math.min(10, newScale));
                }
                const currentAngle = getAngle(e.touches);
                const angleDelta = currentAngle - initialAngle;
                state.rotation = initialRotation + angleDelta;

                updateTransform();
            }
        }, { passive: false });
    </script>
</body>
</html>
