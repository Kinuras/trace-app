<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>TraceLock - Draw Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: 'Inter', sans-serif; color-scheme: dark;
            overscroll-behavior: none;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        input[type=range] { accent-color: #6366f1; }
        .tool { background:#1e293b; color:#e2e8f0; padding:.6rem 0; border-radius:.75rem; display:flex; flex-direction:column; align-items:center; gap:.25rem; font-size:.7rem; font-weight:500; cursor:pointer; transition:transform .1s; }
        .tool:active { transform: scale(.95); }
        .tool.on { background:#4f46e5; color:#fff; }
        .tool i { font-size:.95rem; }

        #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; background: #000; transform-origin: center; }
        #stage { position: fixed; inset: 0; z-index: 1; touch-action: none; overflow: hidden; }
        #stage.locked { pointer-events: none; }
        #overlay {
            position: absolute; left: 0; top: 0; display: none;
            transform-origin: center center; will-change: transform; pointer-events: none;
        }
        #overlayImg { width: 100%; height: auto; display: block; max-width: none; }
        #grid {
            position: absolute; inset: 0; display: none;
            background-image:
                linear-gradient(to right, rgba(255,255,255,.85) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,.85) 1px, transparent 1px);
            background-size: 12.5% 12.5%;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.85);
            mix-blend-mode: difference;
        }
    </style>
</head>
<body>

    <video id="cam" autoplay playsinline muted></video>

    <div id="stage">
        <div id="overlay">
            <img id="overlayImg" alt="" draggable="false">
            <div id="grid"></div>
        </div>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="fixed inset-0 flex flex-col items-center justify-center p-6 text-center z-50 bg-slate-950/95">
        <div class="w-20 h-20 rounded-full bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center mb-4 text-indigo-400 text-2xl">
            <i class="fa-solid fa-pencil"></i>
        </div>
        <h2 class="text-xl font-bold mb-2 text-white">Choose a Reference Image</h2>
        <p class="text-slate-400 text-sm max-w-xs mb-6">Prop your phone over your paper, overlay the image, and trace it.</p>
        <label class="cursor-pointer bg-indigo-600 active:scale-95 transition text-white px-6 py-3 rounded-xl font-semibold shadow-lg shadow-indigo-600/30 flex items-center gap-2">
            <i class="fa-solid fa-image"></i> Choose Image
            <input type="file" id="imageUpload" accept="image/*" class="hidden">
        </label>
    </div>

    <!-- Camera error -->
    <div id="camError" class="fixed inset-0 hidden flex-col items-center justify-center p-6 text-center z-[60] bg-slate-950">
        <div class="text-rose-400 text-3xl mb-3"><i class="fa-solid fa-video-slash"></i></div>
        <h2 class="text-lg font-bold text-white mb-2">Camera unavailable</h2>
        <p id="camErrorMsg" class="text-slate-400 text-sm max-w-xs mb-5"></p>
        <button id="retryCam" class="bg-indigo-600 active:scale-95 transition text-white px-6 py-3 rounded-xl font-semibold">Allow Camera / Retry</button>
    </div>

    <!-- Size slider: faint bar at the top so the image stays visible while resizing; hidden when locked -->
    <div id="sizeBar" class="fixed left-3 right-3 max-w-md mx-auto z-40 rounded-full px-4 py-2 flex items-center gap-3"
         style="top: calc(env(safe-area-inset-top) + .75rem); background: rgba(15,23,42,.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: .55; transition: opacity .2s">
        <i class="fa-solid fa-up-right-and-down-left-from-center text-white text-xs"></i>
        <input type="range" id="scaleRange" min="0" max="100" step="0.5" value="50" class="flex-1 h-2">
        <span id="scaleVal" class="text-xs font-semibold text-white w-11 text-right">100%</span>
    </div>

    <!-- Tracking status (only while locked) -->
    <div id="trackBadge" class="fixed left-1/2 -translate-x-1/2 hidden z-50 px-4 py-2 rounded-full text-xs font-bold shadow-2xl pointer-events-none bg-slate-800 text-white"
         style="top: calc(env(safe-area-inset-top) + 1rem)"></div>

    <!-- Floating unlock / show-controls button (only while locked) -->
    <button id="unlockFab" class="fixed hidden z-50 bg-rose-600 text-white px-5 py-3 rounded-full text-sm font-bold shadow-2xl items-center gap-2 active:scale-95"
            style="right:1rem; bottom: calc(env(safe-area-inset-bottom) + 1rem)">
        <i class="fa-solid fa-lock"></i> Unlock
    </button>

    <!-- Controls -->
    <div id="controlPanel" class="fixed left-3 right-3 max-w-md mx-auto glass-panel rounded-2xl p-3 shadow-2xl z-40" style="bottom: calc(env(safe-area-inset-bottom) + .75rem)">
        <div class="flex items-center justify-between mb-2">
            <h1 class="font-semibold text-sm text-slate-200 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>TraceLock <span class="text-[10px] font-normal text-slate-500">v7</span></h1>
            <div class="flex gap-2">
                <button id="resetBtn" class="w-9 h-9 rounded-lg bg-slate-800 text-slate-300" title="Reset position"><i class="fa-solid fa-rotate-left"></i></button>
                <button id="minimizeBtn" class="w-9 h-9 rounded-lg bg-slate-800 text-slate-300" title="Collapse"><i class="fa-solid fa-chevron-down transition-transform duration-300" id="minimizeIcon"></i></button>
            </div>
        </div>

        <div id="panelContent" class="space-y-2.5">
            <p class="text-[11px] text-slate-500 leading-snug">Drag to move · pinch to resize · twist to rotate</p>

            <div>
                <div class="flex justify-between text-xs text-slate-400"><span>Opacity</span><span id="opacityVal">50%</span></div>
                <input type="range" id="opacityRange" min="5" max="100" value="50" class="w-full h-2">
            </div>
            <div>
                <div class="flex justify-between text-xs text-slate-400"><span>Camera zoom</span><span id="zoomVal">1.0x</span></div>
                <input type="range" id="zoomRange" min="1" max="4" step="0.1" value="1" class="w-full h-2">
            </div>

            <div class="grid grid-cols-4 gap-2">
                <label class="tool"><i class="fa-solid fa-folder-open text-indigo-400"></i><span>Image</span>
                    <input type="file" id="imageUploadSecondary" accept="image/*" class="hidden"></label>
                <button id="outlineBtn" class="tool"><i class="fa-solid fa-pen-nib"></i><span>Outline</span></button>
                <button id="gridBtn" class="tool"><i class="fa-solid fa-border-all"></i><span>Grid</span></button>
                <button id="invertBtn" class="tool"><i class="fa-solid fa-circle-half-stroke"></i><span>Invert</span></button>
                <button id="flipHBtn" class="tool"><i class="fa-solid fa-left-right"></i><span>Flip H</span></button>
                <button id="flipVBtn" class="tool"><i class="fa-solid fa-up-down"></i><span>Flip V</span></button>
                <button id="torchBtn" class="tool"><i class="fa-solid fa-bolt"></i><span>Light</span></button>
                <button id="flipCamBtn" class="tool"><i class="fa-solid fa-camera-rotate"></i><span>Camera</span></button>
            </div>

            <button id="lockBtn" class="w-full py-3 rounded-xl font-bold flex items-center justify-center gap-3 bg-indigo-600 active:scale-[0.98] text-white">
                <i class="fa-solid fa-lock"></i> Lock to Paper
            </button>
        </div>
    </div>

    <script>
        // Show any script error on screen so problems can be diagnosed on a phone
        window.addEventListener('error', (e) => {
            let b = document.getElementById('errBanner');
            if (!b) {
                b = document.createElement('div'); b.id = 'errBanner';
                b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;color:#fff;font:11px/1.3 monospace;padding:6px 8px;pointer-events:none';
                document.body.appendChild(b);
            }
            b.textContent = 'Error: ' + e.message + ' (line ' + e.lineno + ')';
        });
        const $ = (id) => document.getElementById(id);
        const cam = $('cam'), stage = $('stage'), overlay = $('overlay'), img = $('overlayImg');

        const SIZE_MAX = 5;   // size slider range: 1/5 (20%) to 5x (500%), 100% in the middle
        const state = {
            x: 0, y: 0, scale: 1, rot: 0, opacity: 0.5,
            flipH: false, flipV: false, inverted: false, outline: false, grid: false,
            locked: false, hasImage: false,
            facing: 'environment', stream: null, torch: false,
            zoom: 1, hwZoom: false,
            origUrl: '', outlineUrl: ''
        };

        /* ---------------- Camera ---------------- */
        async function startCamera() {
            $('camError').classList.add('hidden'); $('camError').classList.remove('flex');
            if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return showCamError('Open this page over HTTPS (your GitHub Pages link) in Safari or Chrome.');
            }
            if (state.stream) state.stream.getTracks().forEach(t => t.stop());
            state.torch = false; $('torchBtn').classList.remove('on');

            const attempts = [
                { video: { facingMode: { ideal: state.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
                { video: { facingMode: state.facing }, audio: false },
                { video: true, audio: false }
            ];
            let lastErr;
            for (const c of attempts) {
                try {
                    state.stream = await navigator.mediaDevices.getUserMedia(c);
                    cam.srcObject = state.stream;
                    await cam.play().catch(() => {});
                    setupCaps();
                    return;
                } catch (e) { lastErr = e; if (e.name === 'NotAllowedError') break; }
            }
            let msg = 'Could not start the camera.';
            if (lastErr) {
                if (lastErr.name === 'NotAllowedError') msg = 'Camera permission was denied. Allow camera access for this site in browser settings, then tap Retry.';
                else if (lastErr.name === 'NotFoundError') msg = 'No camera was found on this device.';
                else if (lastErr.name === 'NotReadableError') msg = 'Another app is using the camera. Close it and tap Retry.';
                else msg = lastErr.name + ': ' + lastErr.message;
            }
            showCamError(msg);
        }
        function showCamError(msg) {
            $('camErrorMsg').textContent = msg;
            $('camError').classList.remove('hidden'); $('camError').classList.add('flex');
        }
        function setupCaps() {
            const track = state.stream.getVideoTracks()[0];
            const caps = (track && track.getCapabilities) ? track.getCapabilities() : {};
            $('torchBtn').style.display = caps.torch ? '' : 'none';
            state.hwZoom = !!caps.zoom;
            if (caps.zoom) {
                $('zoomRange').min = caps.zoom.min; $('zoomRange').max = Math.min(caps.zoom.max, 8);
                $('zoomRange').step = caps.zoom.step || 0.1;
            } else { $('zoomRange').min = 1; $('zoomRange').max = 4; $('zoomRange').step = 0.1; }
            state.zoom = Math.max(1, +$('zoomRange').min);
            $('zoomRange').value = state.zoom; applyZoom();
        }
        function applyZoom() {
            $('zoomVal').textContent = (+state.zoom).toFixed(1) + 'x';
            const track = state.stream && state.stream.getVideoTracks()[0];
            if (state.hwZoom && track) {
                cam.style.transform = 'none';
                track.applyConstraints({ advanced: [{ zoom: state.zoom }] }).catch(() => {});
            } else {
                cam.style.transform = `scale(${state.zoom})`;   // digital fallback (iOS)
            }
        }
        $('zoomRange').addEventListener('input', e => { state.zoom = +e.target.value; applyZoom(); });
        $('torchBtn').addEventListener('click', async () => {
            const track = state.stream && state.stream.getVideoTracks()[0];
            if (!track) return;
            try {
                await track.applyConstraints({ advanced: [{ torch: !state.torch }] });
                state.torch = !state.torch;
                $('torchBtn').classList.toggle('on', state.torch);
            } catch (_) {}
        });
        $('retryCam').addEventListener('click', startCamera);
        $('flipCamBtn').addEventListener('click', () => {
            state.facing = state.facing === 'environment' ? 'user' : 'environment';
            startCamera();
        });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && (!state.stream || !state.stream.active)) startCamera();
        });
        // Some phones suspend the stream while the file picker is open
        cam.addEventListener('pause', () => { if (!document.hidden) cam.play().catch(() => {}); });
        startCamera();

        /* ---------------- Rendering ---------------- */
        function render() {
            const w = overlay.offsetWidth, h = overlay.offsetHeight;
            const sx = state.scale * (state.flipH ? -1 : 1), sy = state.scale * (state.flipV ? -1 : 1);
            overlay.style.transform =
                `translate(${state.x - w / 2}px, ${state.y - h / 2}px) rotate(${state.rot}rad) scale(${sx}, ${sy})`;
            overlay.style.opacity = state.opacity;
            img.style.filter = state.inverted ? 'invert(100%)' : 'none';
            $('grid').style.display = state.grid ? 'block' : 'none';
            $('scaleRange').value = Math.min(100, Math.max(0, 50 + 50 * Math.log(state.scale) / Math.log(SIZE_MAX)));
            $('scaleVal').textContent = Math.round(state.scale * 100) + '%';
        }
        function resetPosition() {
            state.x = innerWidth / 2; state.y = innerHeight / 2.6; state.scale = 1; state.rot = 0;
            state.flipH = state.flipV = false;
            $('flipHBtn').classList.remove('on'); $('flipVBtn').classList.remove('on');
            render();
        }

        /* ---------------- Image loading + outline ---------------- */
        function makeOutline(source) {
            const max = 1100;
            const k = Math.min(1, max / Math.max(source.naturalWidth, source.naturalHeight));
            const w = Math.max(1, Math.round(source.naturalWidth * k)), h = Math.max(1, Math.round(source.naturalHeight * k));
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            const ctx = c.getContext('2d', { willReadFrequently: true });
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
            ctx.drawImage(source, 0, 0, w, h);
            const src = ctx.getImageData(0, 0, w, h), d = src.data;
            const g = new Float32Array(w * h);
            for (let i = 0; i < w * h; i++) g[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2];
            const out = ctx.createImageData(w, h), o = out.data;
            for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
                const i = y * w + x;
                const gx = -g[i-w-1] - 2*g[i-1] - g[i+w-1] + g[i-w+1] + 2*g[i+1] + g[i+w+1];
                const gy = -g[i-w-1] - 2*g[i-w] - g[i-w+1] + g[i+w-1] + 2*g[i+w] + g[i+w+1];
                const m = Math.sqrt(gx * gx + gy * gy);
                const a = Math.max(0, Math.min(255, (m - 40) * 3));
                const p = i * 4;
                o[p] = o[p+1] = o[p+2] = 255; o[p+3] = a;   // white lines, transparent elsewhere
            }
            ctx.clearRect(0, 0, w, h); ctx.putImageData(out, 0, 0);
            return c.toDataURL('image/png');
        }
        function showCurrent() { img.src = state.outline ? state.outlineUrl : state.origUrl; }

        function loadImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            const probe = new Image();
            probe.onload = () => {
                state.origUrl = url;
                try { state.outlineUrl = makeOutline(probe); } catch (_) { state.outlineUrl = url; }
                const baseW = Math.min(innerWidth * 0.85, probe.naturalWidth);
                overlay.style.width = baseW + 'px';
                overlay.style.display = 'block';
                state.hasImage = true;
                showCurrent();
                $('emptyState').classList.add('hidden');
                img.onload = () => { resetPosition(); img.onload = null; };
                if (img.complete && img.naturalWidth) resetPosition();
            };
            probe.src = url;
            e.target.value = '';
            if (!state.stream || !state.stream.active) startCamera();
        }
        $('imageUpload').addEventListener('change', loadImage);
        $('imageUploadSecondary').addEventListener('change', loadImage);

        /* ---------------- Gestures ---------------- */
        const pts = new Map();
        let last = null;
        function snapshot() {
            const p = [...pts.values()];
            if (p.length === 1) return { n: 1, cx: p[0].x, cy: p[0].y };
            const dx = p[1].x - p[0].x, dy = p[1].y - p[0].y;
            return { n: 2, cx: (p[0].x + p[1].x) / 2, cy: (p[0].y + p[1].y) / 2, d: Math.hypot(dx, dy) || 1, a: Math.atan2(dy, dx) };
        }
        stage.addEventListener('pointerdown', (e) => {
            if (!state.hasImage || state.locked) return;
            stage.setPointerCapture(e.pointerId);
            pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pts.size > 2) pts.delete([...pts.keys()][0]);
            last = snapshot();
        });
        stage.addEventListener('pointermove', (e) => {
            if (!pts.has(e.pointerId)) return;
            pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
            const cur = snapshot();
            if (last && cur.n === last.n) {
                state.x += cur.cx - last.cx; state.y += cur.cy - last.cy;
                if (cur.n === 2) {
                    state.scale = Math.min(6, Math.max(0.05, state.scale * cur.d / last.d));
                    // when mirrored, rotation direction visually reverses
                    const dir = (state.flipH ? -1 : 1) * (state.flipV ? -1 : 1);
                    state.rot += (cur.a - last.a) * dir;
                }
                render();
            }
            last = cur;
        });
        const endPtr = (e) => { pts.delete(e.pointerId); last = pts.size ? snapshot() : null; };
        stage.addEventListener('pointerup', endPtr);
        stage.addEventListener('pointercancel', endPtr);
        ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
        document.addEventListener('touchmove', e => { if (e.target === stage) e.preventDefault(); }, { passive: false });

        /* ---------------- Controls ---------------- */
        $('opacityRange').addEventListener('input', (e) => {
            state.opacity = e.target.value / 100; $('opacityVal').textContent = e.target.value + '%'; render();
        });
        // size slider is logarithmic: 100% sits in the middle, 20% at the left end, 500% at the right
        $('scaleRange').addEventListener('input', (e) => { state.scale = Math.pow(SIZE_MAX, (e.target.value - 50) / 50); render(); });
        // bar is faint at rest and a little stronger while it's being used
        const sizeBar = $('sizeBar');
        $('scaleRange').addEventListener('pointerdown', () => { sizeBar.style.opacity = '.9'; });
        ['pointerup', 'pointercancel', 'touchend'].forEach(t => $('scaleRange').addEventListener(t, () => { sizeBar.style.opacity = '.55'; }));

        function toggle(key, btn) {
            state[key] = !state[key]; $(btn).classList.toggle('on', state[key]);
            if (key === 'outline') showCurrent();
            render();
        }
        $('outlineBtn').addEventListener('click', () => toggle('outline', 'outlineBtn'));
        $('gridBtn').addEventListener('click', () => toggle('grid', 'gridBtn'));
        $('invertBtn').addEventListener('click', () => toggle('inverted', 'invertBtn'));
        $('flipHBtn').addEventListener('click', () => toggle('flipH', 'flipHBtn'));
        $('flipVBtn').addEventListener('click', () => toggle('flipV', 'flipVBtn'));
        $('resetBtn').addEventListener('click', () => { if (state.hasImage) resetPosition(); });

        /* ---------------- Paper tracking (pure JS, no downloads) ----------------
           Picks corner-like points on the paper, follows them frame-to-frame by patch
           matching, fits a similarity transform (move + scale + rotate) with RANSAC,
           and applies it to the overlay. */
        const TW = 240;          // tracking resolution (px wide)
        const PH = 6, PSTEP = 2; // patch half-size / sample step for matching
        const SRC = 8, PHC = 4;  // coarse search (half-res): radius (= 16px at full res) / patch half-size
        const SRF = 3;           // fine search radius (full-res px) around the coarse match
        const trk = { on: false, raf: 0, lost: true, lastT: -1, lostFrames: 0, sm: null };

        function badge(text, color) {
            const b = $('trackBadge');
            b.textContent = text;
            b.className = 'fixed left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-xs font-bold shadow-2xl pointer-events-none text-white ' + (color || 'bg-slate-800');
            b.style.display = text ? '' : 'none';
        }

        function grabFrame() {
            const vw = cam.videoWidth, vh = cam.videoHeight;
            if (!vw) return false;
            const W = innerWidth, H = innerHeight;
            const k = Math.max(W / vw, H / vh);          // object-fit: cover
            let sw = W / k, sh = H / k;
            if (!state.hwZoom) { sw /= state.zoom; sh /= state.zoom; }   // digital zoom crop
            trk.ctx.drawImage(cam, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, trk.cw, trk.ch);
            const d = trk.ctx.getImageData(0, 0, trk.cw, trk.ch).data, g = trk.curr;
            for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (d[j] * 77 + d[j+1] * 150 + d[j+2] * 29) >> 8;
            return true;
        }

        // add new corner points (best Shi-Tomasi score per empty grid cell)
        function detect(g, keep) {
            const w = trk.cw, h = trk.ch, cell = 24, m = 8;
            const cols = Math.ceil(w / cell), rows = Math.ceil(h / cell);
            const occ = new Uint8Array(cols * rows);
            for (let i = 0; i < keep.length; i += 2) {
                const cx = Math.min(cols - 1, Math.max(0, (keep[i] / cell) | 0)), cy = Math.min(rows - 1, Math.max(0, (keep[i+1] / cell) | 0));
                occ[cy * cols + cx] = 1;
            }
            const out = keep.slice();
            let added = 0;
            for (let cy = 0; cy < rows && added < 70; cy++) for (let cx = 0; cx < cols; cx++) {
                if (occ[cy * cols + cx]) continue;
                let best = 100, bx = -1, by = -1;   // minimum acceptable score
                const x0 = Math.max(m, cx * cell), x1 = Math.min(w - m, (cx + 1) * cell);
                const y0 = Math.max(m, cy * cell), y1 = Math.min(h - m, (cy + 1) * cell);
                for (let y = y0; y < y1; y += 2) for (let x = x0; x < x1; x += 2) {
                    let sxx = 0, syy = 0, sxy = 0;
                    for (let v = -2; v <= 2; v++) for (let u = -2; u <= 2; u++) {
                        const i = (y + v) * w + x + u;
                        const gx = (g[i+1] - g[i-1]) >> 1, gy = (g[i+w] - g[i-w]) >> 1;
                        sxx += gx * gx; syy += gy * gy; sxy += gx * gy;
                    }
                    const t = (sxx - syy) / 2;
                    const score = (sxx + syy) / 2 - Math.sqrt(t * t + sxy * sxy);
                    if (score > best) { best = score; bx = x; by = y; }
                }
                if (bx >= 0) { out.push(bx, by); added++; }
            }
            return out;
        }

        // half-resolution copy of the current frame (for the wide, coarse search)
        function computeHalf() {
            const w = trk.cw, hw = w >> 1, hh = trk.ch >> 1, g = trk.curr, o = trk.currH;
            for (let y = 0; y < hh; y++) for (let x = 0; x < hw; x++) {
                const i = 2 * y * w + 2 * x;
                o[y * hw + x] = (g[i] + g[i+1] + g[i+w] + g[i+w+1]) >> 2;
            }
        }
        function sadW(a, b, w, ax, ay, bx, by, ph, st) {
            let s = 0;
            for (let v = -ph; v <= ph; v += st) {
                let ia = (ay + v) * w + ax - ph, ib = (by + v) * w + bx - ph;
                for (let u = -ph; u <= ph; u += st, ia += st, ib += st) s += Math.abs(a[ia] - b[ib]);
            }
            return s;
        }
        // coarse search: finds roughly where a key-frame point went, up to ~16px from the prediction
        function matchCoarse(px, py, predX, predY) {
            const hw = trk.cw >> 1, hh = trk.ch >> 1;
            const ix = Math.round(px / 2), iy = Math.round(py / 2);
            if (ix < PHC || iy < PHC || ix >= hw - PHC || iy >= hh - PHC) return null;
            const cx = Math.round(predX / 2), cy = Math.round(predY / 2);
            let best = Infinity, bx = 0, by = 0;
            for (let dy = -SRC; dy <= SRC; dy++) {
                const y = cy + dy; if (y < PHC || y >= hh - PHC) continue;
                for (let dx = -SRC; dx <= SRC; dx++) {
                    const x = cx + dx; if (x < PHC || x >= hw - PHC) continue;
                    const s = sadW(trk.keyH, trk.currH, hw, ix, iy, x, y, PHC, 2);
                    if (s < best) { best = s; bx = x; by = y; }
                }
            }
            if (best === Infinity || best / 25 > 30) return null;
            if (Math.abs(bx - cx) === SRC || Math.abs(by - cy) === SRC) return null;
            return [bx * 2, by * 2];
        }
        // is this estimate a believable camera move compared to the last one?
        function plausible(M, K) {
            if (Math.abs(Math.log(Math.hypot(M.a, M.b) / Math.hypot(K.a, K.b))) > 0.1) return false;
            let dr = Math.atan2(M.b, M.a) - Math.atan2(K.b, K.a);
            dr = Math.atan2(Math.sin(dr), Math.cos(dr));
            if (Math.abs(dr) > 0.2) return false;
            const cx = trk.cw / 2, cy = trk.ch / 2;
            const ax = M.a * cx - M.b * cy + M.tx, ay = M.b * cx + M.a * cy + M.ty;
            const bx = K.a * cx - K.b * cy + K.tx, by = K.b * cx + K.a * cy + K.ty;
            return Math.hypot(ax - bx, ay - by) < 25 + 8 * trk.lostFrames;
        }

        function sad(a, b, ax, ay, bx, by) {
            const w = trk.cw;
            let s = 0;
            for (let v = -PH; v <= PH; v += PSTEP) {
                let ia = (ay + v) * w + ax - PH, ib = (by + v) * w + bx - PH;
                for (let u = -PH; u <= PH; u += PSTEP, ia += PSTEP, ib += PSTEP) s += Math.abs(a[ia] - b[ib]);
            }
            return s;
        }
        // find where the patch around (px,py) in prev went in curr; returns [x,y] or null
        function matchPoint(px, py, predX, predY, sr) {
            const w = trk.cw, h = trk.ch, lim = PH + 1;
            const ix = Math.round(px), iy = Math.round(py);
            if (ix < lim || iy < lim || ix >= w - lim || iy >= h - lim) return null;
            const cx = Math.round(predX), cy = Math.round(predY);
            let best = Infinity, bx = 0, by = 0;
            for (let dy = -sr; dy <= sr; dy++) {
                const y = cy + dy; if (y < lim || y >= h - lim) continue;
                for (let dx = -sr; dx <= sr; dx++) {
                    const x = cx + dx; if (x < lim || x >= w - lim) continue;
                    const s = sad(trk.key, trk.curr, ix, iy, x, y);
                    if (s < best) { best = s; bx = x; by = y; }
                }
            }
            if (best === Infinity || best / 49 > 28) return null;
            if (Math.abs(bx - cx) === sr || Math.abs(by - cy) === sr) return null;  // hit the edge of the window
            // sub-pixel refinement (parabola through neighbours)
            const c0 = best;
            const xm = sad(trk.key, trk.curr, ix, iy, bx - 1, by), xp = sad(trk.key, trk.curr, ix, iy, bx + 1, by);
            const ym = sad(trk.key, trk.curr, ix, iy, bx, by - 1), yp = sad(trk.key, trk.curr, ix, iy, bx, by + 1);
            const dxs = (xm - xp) / (2 * (xm - 2 * c0 + xp) || 1), dys = (ym - yp) / (2 * (ym - 2 * c0 + yp) || 1);
            return [bx + Math.max(-0.5, Math.min(0.5, dxs)) + (px - ix), by + Math.max(-0.5, Math.min(0.5, dys)) + (py - iy)];
        }

        // least-squares similarity transform P -> Q over the given point indices
        function fitSim(P, Q, idx) {
            let pcx = 0, pcy = 0, qcx = 0, qcy = 0;
            for (const i of idx) { pcx += P[2*i]; pcy += P[2*i+1]; qcx += Q[2*i]; qcy += Q[2*i+1]; }
            const n = idx.length; pcx /= n; pcy /= n; qcx /= n; qcy /= n;
            let nr = 0, ni = 0, den = 0;
            for (const i of idx) {
                const dx = P[2*i] - pcx, dy = P[2*i+1] - pcy, ex = Q[2*i] - qcx, ey = Q[2*i+1] - qcy;
                nr += dx * ex + dy * ey; ni += dx * ey - dy * ex; den += dx * dx + dy * dy;
            }
            if (den < 1e-6) return null;
            const a = nr / den, b = ni / den;
            return { a, b, tx: qcx - (a * pcx - b * pcy), ty: qcy - (b * pcx + a * pcy), spread: den / n };
        }
        function ransac(P, Q) {
            const n = P.length / 2;
            if (n < 10) return null;
            let best = [];
            for (let it = 0; it < 80; it++) {
                const i = (Math.random() * n) | 0, j = (Math.random() * n) | 0;
                if (i === j) continue;
                const M = fitSim(P, Q, [i, j]);
                if (!M) continue;
                const s = Math.hypot(M.a, M.b);
                if (s < 0.7 || s > 1.4) continue;
                const inl = [];
                for (let k = 0; k < n; k++) {
                    const x = P[2*k], y = P[2*k+1];
                    const ex = M.a * x - M.b * y + M.tx - Q[2*k], ey = M.b * x + M.a * y + M.ty - Q[2*k+1];
                    if (ex * ex + ey * ey < 2.25) inl.push(k);
                }
                if (inl.length > best.length) best = inl;
            }
            if (best.length < Math.max(10, n * 0.4)) return null;
            const M = fitSim(P, Q, best);
            // agreeing points must be well spread out, or scale/rotation are unreliable
            return M && M.spread > 324 ? { M, inliers: best } : null;
        }

        // A = lock-time view -> current view. Smoothed adaptively: heavy smoothing
        // when nearly still (kills jitter), none when moving fast (no lag).
        function applyTrack(A) {
            const { a, b, tx, ty } = A, B = trk.base, f = trk.f;
            const px = B.x * f, py = B.y * f;
            const T = {
                x: (a * px - b * py + tx) / f, y: (b * px + a * py + ty) / f,
                scale: B.scale * Math.hypot(a, b), rot: B.rot + Math.atan2(b, a)
            };
            const s = trk.sm || (trk.sm = { ...T });
            const dist = Math.hypot(T.x - s.x, T.y - s.y) + Math.abs(T.scale - s.scale) * 300 + Math.abs(T.rot - s.rot) * 200;
            const al = Math.min(1, 0.15 + dist * 0.08);
            s.x += (T.x - s.x) * al; s.y += (T.y - s.y) * al;
            s.scale += (T.scale - s.scale) * al; s.rot += (T.rot - s.rot) * al;
            state.x = s.x; state.y = s.y; state.scale = s.scale; state.rot = s.rot;
            render();
        }
        function composeSim(M, A) {   // apply A first, then M
            return {
                a: M.a * A.a - M.b * A.b, b: M.a * A.b + M.b * A.a,
                tx: M.a * A.tx - M.b * A.ty + M.tx, ty: M.b * A.tx + M.a * A.ty + M.ty
            };
        }

        function trackStep() {
            if (!trk.on) return;
            trk.raf = requestAnimationFrame(trackStep);
            if (cam.readyState < 2 || cam.currentTime === trk.lastT) return;   // wait for a new video frame
            trk.lastT = cam.currentTime;
            try {
                if (!grabFrame()) return;
                // Match key-frame points into the current frame, searching around where the
                // last estimate (key -> current) predicts them. Measuring against a key frame,
                // not the previous frame, stops small errors piling up into drift.
                computeHalf();
                const P = [], Q = [], n = trk.pts.length / 2, K = trk.K, Kp = trk.Kprev;
                for (let i = 0; i < n; i++) {
                    const px = trk.pts[2*i], py = trk.pts[2*i+1];
                    const kx = K.a * px - K.b * py + K.tx, ky = K.b * px + K.a * py + K.ty;
                    // extrapolate using the last frame-to-frame motion (damped)
                    const vx = (kx - (Kp.a * px - Kp.b * py + Kp.tx)) * 0.7, vy = (ky - (Kp.b * px + Kp.a * py + Kp.ty)) * 0.7;
                    const c = matchCoarse(px, py, kx + vx, ky + vy);          // wide, low-res search
                    if (!c) continue;
                    const q = matchPoint(px, py, c[0], c[1], SRF);             // precise, full-res refinement
                    if (q) { P.push(px, py); Q.push(q[0], q[1]); }
                }
                let r = ransac(P, Q);
                if (r && !plausible(r.M, K)) r = null;   // ignore jumps that don't look like real camera motion
                if (r) {
                    trk.Kprev = K; trk.K = r.M;
                    trk.A = composeSim(r.M, trk.Akey);
                    trk.lostFrames = 0;
                    applyTrack(trk.A);
                    // Start a new key frame when the view has changed enough that old patches
                    // no longer match well, or too few points remain
                    const s = Math.hypot(r.M.a, r.M.b), rot = Math.atan2(r.M.b, r.M.a);
                    if (r.inliers.length < 45 || Math.abs(Math.log(s)) > 0.05 || Math.abs(rot) > 0.1) {
                        const kept = [];
                        for (const i of r.inliers) kept.push(Q[2*i], Q[2*i+1]);
                        rekey(kept.length >= 45 ? kept : detect(trk.curr, kept), trk.A);
                    }
                } else {
                    trk.Kprev = K;   // no trustworthy motion: image holds still, no velocity guess
                    if (++trk.lostFrames > 12) {
                        rekey(detect(trk.curr, []), trk.A);   // lost for a while: restart from what the camera sees now
                        trk.lostFrames = 0;
                    }
                }
                if (!!r === trk.lost) {
                    trk.lost = !r;
                    badge(r ? '● Tracking paper' : 'Tracking lost – point at paper', r ? 'bg-emerald-600/90' : 'bg-amber-600/90');
                }
            } catch (e) { console.error(e); }
        }

        // make the current frame the key frame; Akey = lock-time view -> this frame
        function rekey(pts, Akey) {
            const t = trk.key; trk.key = trk.curr; trk.curr = t;
            const th = trk.keyH; trk.keyH = trk.currH; trk.currH = th;
            trk.pts = pts; trk.Akey = Akey;
            trk.K = { a: 1, b: 0, tx: 0, ty: 0 }; trk.Kprev = trk.K;
        }

        function startTracking() {
            trk.cw = TW; trk.ch = Math.round(TW * innerHeight / innerWidth); trk.f = TW / innerWidth;
            const c = document.createElement('canvas'); c.width = trk.cw; c.height = trk.ch;
            trk.ctx = c.getContext('2d', { willReadFrequently: true });
            trk.key = new Uint8Array(trk.cw * trk.ch); trk.curr = new Uint8Array(trk.cw * trk.ch);
            trk.keyH = new Uint8Array((trk.cw >> 1) * (trk.ch >> 1)); trk.currH = new Uint8Array((trk.cw >> 1) * (trk.ch >> 1));
            if (!grabFrame()) { badge('Camera not ready – locked to screen', 'bg-amber-600/90'); return; }
            computeHalf();
            trk.A = { a: 1, b: 0, tx: 0, ty: 0 };
            trk.base = { x: state.x, y: state.y, scale: state.scale, rot: state.rot };
            trk.sm = null; trk.lostFrames = 0;
            rekey(detect(trk.curr, []), trk.A);
            trk.lost = true; trk.lastT = -1; trk.on = true;
            badge('Starting…');
            trk.raf = requestAnimationFrame(trackStep);
        }
        function stopTracking() {
            trk.on = false; cancelAnimationFrame(trk.raf);
            badge('');
        }

        function setLocked(v) {
            if (v && !state.hasImage) { alert('Please choose an image first!'); return; }
            state.locked = v;
            stage.classList.toggle('locked', v);
            $('controlPanel').style.display = v ? 'none' : '';
            $('sizeBar').style.display = v ? 'none' : '';
            updateFab();
            pts.clear(); last = null;
            if (v) startTracking(); else stopTracking();
        }
        $('lockBtn').addEventListener('click', () => setLocked(true));
        // Floating Lock/Unlock button: shown while locked (Unlock) or while the menu is
        // collapsed (Lock), so you can lock without opening the menu and shaking the phone
        function updateFab() {
            const fab = $('unlockFab'), show = state.locked || minimized;
            fab.classList.toggle('hidden', !show); fab.classList.toggle('flex', show);
            fab.classList.toggle('bg-rose-600', state.locked); fab.classList.toggle('bg-indigo-600', !state.locked);
            fab.innerHTML = state.locked ? '<i class="fa-solid fa-lock"></i> Unlock' : '<i class="fa-solid fa-lock-open"></i> Lock';
            // when the collapsed menu is showing, sit above it
            fab.style.bottom = state.locked ? 'calc(env(safe-area-inset-bottom) + 1rem)' : 'calc(env(safe-area-inset-bottom) + 5rem)';
        }
        $('unlockFab').addEventListener('click', () => setLocked(!state.locked));

        let minimized = false;
        $('minimizeBtn').addEventListener('click', () => {
            minimized = !minimized;
            updateFab();
            $('panelContent').classList.toggle('hidden', minimized);
            $('minimizeIcon').style.transform = minimized ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        addEventListener('resize', () => { if (state.hasImage) render(); });

        // Keep screen awake while tracing
        async function keepAwake() { try { await navigator.wakeLock.request('screen'); } catch (_) {} }
        document.addEventListener('click', keepAwake, { once: true });
        document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
    </script>
</body>
</html>
